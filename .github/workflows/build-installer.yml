name: Build installer

on:
  workflow_call:
    inputs:
      host:
        required: true
        type: string
      target:
        required: true
        type: string
      bundles:
        required: true
        type: string
      slug:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      preview:
        required: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag }}
  PREVIEW: ${{ inputs.preview }}

jobs:
  build:
    name: Package
    runs-on: ${{ fromJSON(inputs.host) }}
    steps:
      - name: Put Git Bash ahead of the WSL stub
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitBin = "$env:ProgramFiles\Git\bin"
          if (-not (Test-Path "$gitBin\bash.exe")) {
            throw "Git for Windows is not installed at $gitBin."
          }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev xdg-utils file

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Ensure rustup
        if: runner.os != 'Windows'
        run: |
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ~/.cargo is shared by every job on the host, and rust-cache deletes its
      # registry sources when a job ends; keep this job's registry to itself.
      - name: Give cargo a home of its own
        if: runner.os != 'Windows'
        run: echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      - name: Ensure rustup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          if (-not (Test-Path "$cargoBin\rustup.exe")) {
            $init = "$env:TEMP\rustup-init.exe"
            Invoke-WebRequest -UseBasicParsing https://win.rustup.rs/x86_64 -OutFile $init
            & $init -y --no-modify-path --profile minimal --default-toolchain stable
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed with exit code $LASTEXITCODE" }
          }
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - name: Ensure Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin\perl.exe"
          if (-not (Test-Path $perl)) {
            winget install --id StrawberryPerl.StrawberryPerl --exact --silent `
              --accept-package-agreements --accept-source-agreements --disable-interactivity
            if (-not (Test-Path $perl)) { throw "Strawberry Perl installed but $perl is missing" }
          }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - name: Keep the Windows target directory short
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=C:/onelibrary-4all-target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Windows'
        with:
          cache-bin: false
          key: ${{ inputs.target }}

      - run: pnpm install --frozen-lockfile

      - name: Set version from the release tag
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [ "$PREVIEW" = "true" ]; then version="0.0.0-dev"; fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid release version: $version"
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          node scripts/sync-version.mjs --version "$version"

      - name: Require Apple signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID \
            APPLE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID; do
            [ -n "${!name:-}" ] || { echo "::error::$name is missing"; exit 1; }
          done

      - name: Require Azure signing credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_SIGNING_CERT_PROFILE }}
        run: |
          @(
            "AZURE_TENANT_ID", "AZURE_CLIENT_ID", "AZURE_CLIENT_SECRET",
            "AZURE_SIGNING_ENDPOINT", "AZURE_SIGNING_ACCOUNT_NAME", "AZURE_SIGNING_CERT_PROFILE"
          ) | ForEach-Object {
            if (-not (Get-Item "env:$_" -ErrorAction SilentlyContinue).Value) { throw "$_ is missing" }
          }

      - name: Ensure Azure CLI and signing client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $az = "$env:ProgramFiles\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
          if (-not (Test-Path $az)) {
            winget install --id Microsoft.AzureCLI --exact --silent `
              --accept-package-agreements --accept-source-agreements --disable-interactivity
            if (-not (Test-Path $az)) { throw "Azure CLI installed but $az is missing" }
          }
          cargo install artifact-signing-cli --version 0.11.0 --locked

      - name: Configure Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_SIGNING_CERT_PROFILE }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            json.bundle.windows.signCommand = {
              cmd: "artifact-signing-cli",
              args: [
                "-e", process.env.AZURE_SIGNING_ENDPOINT,
                "-a", process.env.AZURE_SIGNING_ACCOUNT_NAME,
                "-c", process.env.AZURE_SIGNING_CERT_PROFILE,
                "%1",
              ],
            };
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
          '

      - name: Set up the signing keychain
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/onelibrary-4all-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          chmod 600 "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # The search list is shared with other repositories' signing jobs on
          # this Mac: edit it as it stands now and touch only this job's entry.
          # Entries whose file is gone are dropped.
          others="$(security list-keychains -d user | sed 's/^ *"//;s/"$//' |
            while IFS= read -r k; do
              if [ -f "$k" ] && [ "$k" != "$KEYCHAIN" ]; then printf '%s\n' "$k"; fi
            done)"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $others
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Clear prior bundle artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="${CARGO_TARGET_DIR:-target}/${{ inputs.target }}/release/bundle"
          case "$bundle_dir" in
            */release/bundle) rm -rf "$bundle_dir" ;;
            *) echo "::error::refusing unexpected bundle directory: $bundle_dir"; exit 1 ;;
          esac

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CORE_ENCRYPT_TOKEN_CACHE: "false"
          CI: "true"
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          args: --target ${{ inputs.target }} --bundles ${{ inputs.bundles }} --verbose

      - name: Verify Mac architecture
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_ARCH: ${{ inputs.slug == 'darwin-aarch64' && 'arm64' || 'x86_64' }}
        run: |
          set -euo pipefail
          binary="$(find "${CARGO_TARGET_DIR:-target}/${{ inputs.target }}/release/bundle/macos" \
            -type f -path '*/Contents/MacOS/onelibrary-4all' -print -quit)"
          [ -n "$binary" ] || { echo "::error::app binary not found"; exit 1; }
          actual="$(lipo -archs "$binary")"
          [ "$actual" = "$EXPECTED_ARCH" ] || { echo "::error::expected $EXPECTED_ARCH, got $actual"; exit 1; }

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find "${CARGO_TARGET_DIR:-target}/${{ inputs.target }}/release/bundle" -type f ! -name 'rw.*' \
            \( -path '*/bundle/dmg/*.dmg' -o -path '*/bundle/nsis/*-setup.exe' \
               -o -path '*/bundle/appimage/*.AppImage' -o -path '*/bundle/deb/*.deb' \) \
            -exec cp {} out/ \; 2>/dev/null || true

          count="$(find out -type f | wc -l | tr -d ' ')"
          [ "$count" -gt 0 ] || { echo "::error::no installer was produced"; exit 1; }
          for f in out/*; do
            case "$f" in
              *.dmg)       want="out/onelibrary-4all-${RELEASE_VERSION}-${{ inputs.slug }}.dmg" ;;
              *-setup.exe) want="out/onelibrary-4all-${RELEASE_VERSION}-${{ inputs.slug }}-setup.exe" ;;
              *.AppImage)  want="out/onelibrary-4all-${RELEASE_VERSION}-${{ inputs.slug }}.AppImage" ;;
              *.deb)       want="out/onelibrary-4all-${RELEASE_VERSION}-${{ inputs.slug }}.deb" ;;
              *) echo "::error::unexpected bundle $f"; exit 1 ;;
            esac
            [ "$f" = "$want" ] || mv "$f" "$want"
          done
          ls -l out

      - name: Notarize and staple the disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for dmg in out/*.dmg; do
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
          done

      - name: Verify macOS signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "${CARGO_TARGET_DIR:-target}/${{ inputs.target }}/release/bundle/macos" \
            -maxdepth 1 -type d -name '*.app' -print -quit)"
          [ -n "$app" ] || { echo "::error::app bundle not found"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl -a -vvv -t exec "$app"
          for dmg in out/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vv "$dmg"
          done

      - name: Verify Windows signatures and timestamps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem out\*-setup.exe)
          if ($installer.Count -ne 1) { throw "Expected one installer, found $($installer.Count)." }
          # Tauri patches and signs the app executable before embedding it in
          # NSIS, then restores the original build output after packaging. The
          # executable left in target/release is therefore not the shipped,
          # signed copy and must not be used as a post-build verification target.
          $files = @($installer[0].FullName)
          $windowsKits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signtool = Get-ChildItem -LiteralPath $windowsKits -Filter signtool.exe -Recurse -File |
            Where-Object { $_.Directory.Name -eq "x64" } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found under $windowsKits." }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne "Valid") { throw "$file has signature status $($sig.Status)." }
            if (-not $sig.TimeStamperCertificate) { throw "$file has no timestamp." }
            & $signtool.FullName verify /pa /tw /v $file
            if ($LASTEXITCODE -ne 0) { throw "signtool rejected $file." }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ inputs.target }}
          path: out/
          retention-days: 90

      - name: Tear down the signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/onelibrary-4all-signing.keychain-db"
          # Remove only this job's entry; restoring a snapshot would also drop
          # keychains other jobs added since.
          others="$(security list-keychains -d user | sed 's/^ *"//;s/"$//' | grep -vxF "$KEYCHAIN" || true)"
          # shellcheck disable=SC2086
          security list-keychains -d user -s $others || true
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Tear down the Azure login
        if: always() && runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CORE_ENCRYPT_TOKEN_CACHE: "false"
        run: |
          $az = "$env:ProgramFiles\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
          if (Test-Path $az) { & $az account clear --only-show-errors 2>$null }
          foreach ($f in "msal_token_cache.json", "service_principal_entries.json", "msal_http_cache.json") {
            Remove-Item "$env:USERPROFILE\.azure\$f" -Force -ErrorAction SilentlyContinue
          }
