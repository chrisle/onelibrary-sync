[package]
name = "onelibrary-sync-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Keeps a USB stick's Device Library in line with its OneLibrary, for players that read only the Device Library."

[lib]
name = "onelibrary_sync_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
# Whether rekordbox or RBXport is running, in one scan of the process list.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
onelibrary-sync = { path = "../crates/sync" }
# Pinned snapshot of RBXport's volume crate, trimmed to listing, watching
# and ejecting.
rbl-devices = { path = "../crates/rbl-devices" }

[dev-dependencies]
tempfile = "3"
rbl-onelibrary = { path = "../crates/rbl-onelibrary" }
