[package]
name = "rbl-devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Finds removable media, notices it arriving and leaving, and ejects it."

[lints]
workspace = true

[dependencies]
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Only the Windows eject logs why Windows refused it.
tracing = { workspace = true }
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_WindowsProgramming"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFURL", "CFDictionary"] }
objc2-disk-arbitration = { version = "0.3", default-features = false, features = ["std", "DADisk", "DASession"] }
