[workspace]
members = [
  "src-tauri",
  "crates/sync",
  "crates/rbl-anlz",
  "crates/rbl-core",
  "crates/rbl-devices",
  "crates/rbl-onelibrary",
  "crates/rbl-pdb",
]
# The vendored RBXport crates retain their upstream tests and diagnostic
# examples; this app's default checks exercise the sync and the app itself.
default-members = ["src-tauri", "crates/sync"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-2.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

# The same bar as rbxport, whose crates this app builds on.
[workspace.lints.clippy]
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
await_holding_lock = "deny"
needless_pass_by_value = "deny"
large_enum_variant = "deny"
inefficient_to_string = "deny"
unnecessary_to_owned = "deny"
implicit_clone = "deny"
cloned_instead_of_copied = "deny"
dbg_macro = "deny"
print_stdout = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
chunks_exact_to_as_chunks = "allow"
manual_is_multiple_of = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# A panic inside a command is caught and returned as an error.
panic = "unwind"
strip = "symbols"

[profile.dev.package."*"]
# SQLCipher is unusable in a debug build otherwise.
opt-level = 2
